services:
  - type: web
    name: moca-admin
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://sanye519.github.io,http://127.0.0.1:8766,http://localhost:8766
